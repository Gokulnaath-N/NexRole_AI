services:
  postgres:
    image: postgres:15
    container_name: nexrole-postgres
    environment:
      POSTGRES_DB: nexrole_dev
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: nexrole-redis
    ports:
      - "6378:6379"

volumes:
  postgres_data:
    name: nexrole_postgres_data